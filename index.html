<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Project</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#4CAF50,#0f9d58);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
}

.card{
text-align:center;
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
z-index:2;
}

h1{
font-size:42px;
margin-bottom:15px;
}

p{
font-size:18px;
opacity:.9;
margin-bottom:20px;
}

button{
padding:12px 28px;
border:none;
border-radius:50px;
background:#fff;
color:#2e7d32;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.emoji{
position:fixed;
bottom:-40px;
font-size:30px;
animation:floatUp linear forwards;
pointer-events:none;
}

@keyframes floatUp{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">
<h1>🚀 My First Project</h1>
<p>This is my first project on GitHub.</p>
<button onclick="hello()">Click Me</button>
</div>

<script>
function hello(){
alert("🎉 Thanks for visiting my first GitHub project!");
}

const emojis=[
"❤️","🎉","✨","🔥","🚀","😊","🌸","💚","⭐","🍀","💖","😁"
];

function createEmoji(){
const e=document.createElement("div");
e.className="emoji";
e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(e);

setTimeout(()=>{
e.remove();
},8000);
}

setInterval(createEmoji,300);
</script>

</body>
</html>
